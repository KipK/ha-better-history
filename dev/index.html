<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ha-better-history dev</title>
    <style>
      body { margin: 24px; font-family: sans-serif; background: #1a1a2e; color: #e0e0e0; }
      h2 { color: #aaa; font-size: 13px; margin: 24px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
      .mode-badge {
        display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
        margin-left: 8px; vertical-align: middle;
      }
      .mode-live  { background: #4caf50; color: #fff; }
      .mode-mock  { background: #ff9800; color: #fff; }
      .mode-error { background: #f44336; color: #fff; }
      ha-better-history { display: block; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 24px; background: #16213e; }
      .error-banner { background: #3d1515; color: #ff6b6b; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1 style="font-size:18px;margin-bottom:4px">ha-better-history dev
      <span id="mode-badge" class="mode-badge mode-mock">MOCK</span>
    </h1>
    <p style="color:#888;font-size:13px;margin-top:0">
      Set <code>VITE_HA_URL</code> and <code>VITE_HA_TOKEN</code> in <code>.env</code> for live HA data.
    </p>
    <div id="error-banner" class="error-banner" hidden></div>

    <h2>1 — entities shortcut (temperature + humidity)</h2>
    <ha-better-history id="c1"></ha-better-history>

    <h2>2 — explicit series with scaleGroup</h2>
    <ha-better-history id="c2"></ha-better-history>

    <h2>3 — with date picker</h2>
    <ha-better-history id="c3" show-date-picker></ha-better-history>

    <h2>4 — with entity picker</h2>
    <ha-better-history id="c4" show-entity-picker></ha-better-history>

    <h2>5 — climate heating overlay</h2>
    <ha-better-history id="c5"></ha-better-history>

    <h2>6 — scaleMode: manual</h2>
    <ha-better-history id="c6"></ha-better-history>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
